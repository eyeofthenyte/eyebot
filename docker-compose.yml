name: eyebot

services:
  eyebot:
    image: ${IMAGE_NAME:-eyebot}:${EYEBOT_VERSION:-2.0.0}
    build:
      context: .
      dockerfile: dockerfile
      args:
        EYEBOT_VERSION: ${EYEBOT_VERSION:-2.0.0}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      EYEBOT_PROCESS: src/eyebot.py
      EYEBOT_GUILD_CONFIG_DIR: /app/data/guilds
      EYEBOT_SECRET_DIR: /app/data/secrets
      EYEBOT_MASTER_KEY_FILE: /run/secrets/eyebot_master_key
      EYEBOT_PUBLIC_MEDIA_DIR: /app/data/public_media
      # Optional .env override; otherwise config.yaml supplies the URL.
      EYEBOT_PUBLIC_MEDIA_BASE_URL: ${EYEBOT_PUBLIC_MEDIA_BASE_URL:-}
    ports:
      - "${EYEBOT_GATEWAY_BIND:-127.0.0.1:8080}:8080"
    secrets:
      - eyebot_master_key
    volumes:
      # Set EYEBOT_CONFIG_PATH to select another host-side config file.
      - type: bind
        source: ${EYEBOT_CONFIG_PATH:-./config.yaml}
        target: /app/config.yaml
        bind:
          # Fail instead of silently creating a directory when the file is absent.
          create_host_path: false
      - type: bind
        source: ${EYEBOT_PLATFORM_CONFIG_PATH:-./platforms.yaml}
        target: /app/platforms.yaml
        bind:
          create_host_path: false
      - type: bind
        source: ./service_account.json
        target: /app/service_account.json
        read_only: true
      - type: bind
        source: ./storage.json
        target: /app/storage.json
      - type: volume
        source: guild-data
        target: /app/data/guilds
      - type: volume
        source: secret-data
        target: /app/data/secrets
      - type: volume
        source: public-media
        target: /app/data/public_media
    healthcheck:
      test:
        - CMD
        - python
        - healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  guild-data:
  secret-data:
  public-media:

secrets:
  eyebot_master_key:
    file: ${EYEBOT_MASTER_KEY_SOURCE:-./secrets/eyebot_master_key}
